name: CI

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "Formula/**"

jobs:
  check-toolchain-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify Node version in sync across CI and devcontainer
        run: |
          node -e "
            const fs = require('fs');
            const ci = fs.readFileSync('.github/workflows/ci.yml', 'utf8');
            const devcontainer = require('./.devcontainer/devcontainer.json');
            const ciVersions = [...ci.matchAll(/node-version:\s*(\d+)/g)].map(m => m[1]);
            const ciVersion = [...new Set(ciVersions)].sort().join(',');
            const devcontainerVersion = devcontainer.features['ghcr.io/devcontainers/features/node:2'].version;
            if (ciVersion !== devcontainerVersion) {
              console.error('Node version mismatch: CI=' + ciVersion + ' devcontainer=' + devcontainerVersion);
              process.exit(1);
            }
            console.log('Node version in sync: ' + ciVersion);
          "

  build-and-test:
    needs: check-toolchain-sync
    strategy:
      matrix:
        os:
          - { name: ubuntu, runner: ubuntu-latest }
          - { name: windows, runner: windows-latest }
      fail-fast: false
    runs-on: ${{ matrix.os.runner }}
    name: build-and-test (${{ matrix.os.name }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        if: matrix.os.name == 'ubuntu'
        run: npm run typecheck

      - name: Lint
        if: matrix.os.name == 'ubuntu'
        run: npm run lint

      - name: Format check
        if: matrix.os.name == 'ubuntu'
        run: npm run format:check

      - name: Clean and build
        run: npm run build:clean

      - name: Run tests
        run: npm test

  docker-build:
    needs: check-toolchain-sync
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag mnemonic-mcp:ci .
